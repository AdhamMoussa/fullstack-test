packages:
  - 'apps/*'
  - 'packages/*'

# pnpm refuses to install or run on a Node version other than `engines.node`.
engineStrict: true

allowBuilds:
  '@prisma/client': true
  '@prisma/engines': true
  '@scarf/scarf': false
  '@swc/core': true
  esbuild: true
  prisma: true

catalog:
  '@types/node': '^26.6.6'
  tsup: '^9.0.0'
  typescript: '~6.0.3'
  zod: '4.6.7'
