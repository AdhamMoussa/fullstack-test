# Static site for @repo/web behind nginxinc/nginx-unprivileged: non-root (uid 101),
# port 8080, temp paths already pointed at /tmp by the image.
server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Security headers on every response. nginx does not merge `add_header` across
    # levels: a location that adds a header drops the inherited ones, so the
    # locations below that set caching headers repeat these three.
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header X-Frame-Options DENY always;

    # No CSP here: the API origin changes per deployment, and connect-src would have
    # to be templated at deploy time. Documented as a follow-up in the README.

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types application/javascript text/css image/svg+xml application/json;

    # Vite writes fingerprinted files to assets/, so they never change in place.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy no-referrer always;
        add_header X-Frame-Options DENY always;
    }

    # The shell must be revalidated, or a deploy keeps serving the previous bundles.
    location = /index.html {
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy no-referrer always;
        add_header X-Frame-Options DENY always;
    }

    # Client-side routing: unknown paths get the shell, not a 404.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
