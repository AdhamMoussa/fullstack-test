# The root `pnpm lint|typecheck|test|build` scripts target the dev Compose
# containers, so CI calls the `:inner` Turbo scripts directly on the runner and
# starts only the `mongo` service from `compose.yaml`.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      MONGODB_URI: mongodb://127.0.0.1:27017/assessment?replicaSet=rs0&directConnection=true
      MONGODB_TEST_URI: mongodb://127.0.0.1:27017/assessment_test?replicaSet=rs0&directConnection=true
      VITE_API_URL: http://localhost:3000
      TURBO_TELEMETRY_DISABLED: '1'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check formatting
        run: pnpm format:check

      - name: Start MongoDB
        run: docker compose up -d --wait mongo

      - name: Lint
        run: pnpm lint:inner

      - name: Typecheck
        run: pnpm typecheck:inner

      - name: Build
        run: pnpm build:inner

      - name: Push schema to the test database
        run: MONGODB_URI="$MONGODB_TEST_URI" pnpm --filter @repo/db exec prisma db push --skip-generate

      - name: Run unit tests
        run: pnpm test:inner

      - name: Run API e2e tests
        run: pnpm --filter @repo/api test:e2e

      - name: Dump MongoDB logs
        if: failure()
        run: docker compose logs mongo
