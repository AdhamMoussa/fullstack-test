# The root `pnpm lint|typecheck|test|build` scripts target the dev Compose
# containers, so CI calls the `:inner` Turbo scripts directly on the runner and
# starts its own single-node MongoDB replica set.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      MONGODB_URI: mongodb://127.0.0.1:27017/assessment?replicaSet=rs0&directConnection=true
      MONGODB_TEST_URI: mongodb://127.0.0.1:27017/assessment_test?replicaSet=rs0&directConnection=true
      VITE_API_URL: http://localhost:3000
      TURBO_TELEMETRY_DISABLED: '1'
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check formatting
        run: pnpm format:check

      # CI starts Mongo itself instead of using the dev Compose healthcheck. The
      # member host `127.0.0.1:27017` works both inside the container and from the runner.
      # mongo:7.0 to match compose.yaml; MongoDB 8 cannot start on the runner's kernel (SERVER-121912).
      - name: Start MongoDB (single-node replica set)
        run: |
          docker run --detach --name mongo --publish 127.0.0.1:27017:27017 mongo:7.0 --replSet rs0 --bind_ip_all
          for attempt in $(seq 1 30); do
            if docker exec mongo mongosh --quiet --eval "
              try { rs.status().ok } catch (error) {
                rs.initiate({ _id: 'rs0', members: [{ _id: 0, host: '127.0.0.1:27017' }] })
              }
              db.hello().isWritablePrimary
            " 2>/dev/null | grep -q true; then
              echo "MongoDB replica set is ready (attempt $attempt)"
              exit 0
            fi
            sleep 2
          done
          echo "::error::MongoDB did not become a writable primary within 60 s"
          docker logs mongo
          exit 1

      - name: Lint
        run: pnpm lint:inner

      - name: Typecheck
        run: pnpm typecheck:inner

      - name: Build
        run: pnpm build:inner

      - name: Push schema to the test database
        run: MONGODB_URI="$MONGODB_TEST_URI" pnpm --filter @repo/db exec prisma db push --skip-generate

      - name: Run unit tests
        run: pnpm test:inner

      - name: Run API e2e tests
        run: pnpm --filter @repo/api test:e2e

      - name: Dump MongoDB logs
        if: failure()
        run: docker logs mongo

  docker:
    name: Production images
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # Builds both production images and waits for the API and web healthchecks,
      # which also proves the Mailpit/schema/Mongo wiring in compose.prod.yaml.
      - name: Build and start the production stack
        run: docker compose -f compose.prod.yaml up --detach --build --wait --wait-timeout 300

      - name: Smoke test the images
        run: |
          set -euo pipefail
          curl -fsS http://localhost:3001/health -o /tmp/health.json
          cat /tmp/health.json
          grep -q '"ok"' /tmp/health.json

          curl -fsS http://localhost:8080/ -o /tmp/index.html
          grep -q '<div id="root">' /tmp/index.html

          # SPA fallback: a client route returns the same shell as "/".
          curl -fsS http://localhost:8080/signin -o /tmp/signin.html
          cmp /tmp/index.html /tmp/signin.html

          # Swagger is disabled when NODE_ENV=production.
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:3001/docs)" = 404

      - name: Show container logs
        if: failure()
        run: docker compose -f compose.prod.yaml logs

      - name: Stop the stack
        if: always()
        run: docker compose -f compose.prod.yaml down -v
