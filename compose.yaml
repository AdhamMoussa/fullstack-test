services:
  mongo:
    image: mongo:8.0
    hostname: mongo
    restart: unless-stopped
    command: ['--replSet', 'rs0', '--bind_ip_all']
    ports:
      - '127.0.0.1:27017:27017'
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          mongosh --quiet --eval "
          try { rs.status().ok } catch (e) {
          rs.initiate({ _id: 'rs0', members: [{ _id: 0, host: 'mongo:27017' }] })
          }
          db.hello().isWritablePrimary
          " | grep true
      interval: 5s
      timeout: 10s
      retries: 20
      start_period: 10s

  db:
    build:
      context: .
      dockerfile: packages/db/Dockerfile
    working_dir: /app
    init: true
    depends_on:
      mongo:
        condition: service_healthy
    environment:
      MONGODB_URI: 'mongodb://mongo:27017/assessment?replicaSet=rs0'
      MONGODB_TEST_URI: 'mongodb://mongo:27017/assessment_test?replicaSet=rs0'
      pnpm_config_verify_deps_before_run: 'false'
    ports:
      - '127.0.0.1:5555:5555' # Prisma Studio (`pnpm db:studio`)
    volumes:
      - .:/app
      # Anonymous volumes keep Linux node_modules out of the host tree.
      # `pnpm dev` recreates them from the fresh image (--renew-anon-volumes).
      - /app/node_modules
      - /app/apps/api/node_modules
      - /app/packages/db/node_modules
    healthcheck:
      test: ['CMD-SHELL', 'test -f /tmp/db-ready']
      interval: 3s
      timeout: 5s
      retries: 40
      start_period: 30s

  contract:
    build:
      context: .
      dockerfile: packages/contract/Dockerfile
    working_dir: /app
    init: true
    environment:
      pnpm_config_verify_deps_before_run: 'false'
    volumes:
      - .:/app
      - /app/node_modules
      - /app/packages/contract/node_modules
    healthcheck:
      test: ['CMD-SHELL', 'test -f packages/contract/dist/index.js']
      interval: 3s
      timeout: 5s
      retries: 40
      start_period: 20s

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    working_dir: /app
    init: true
    depends_on:
      contract:
        condition: service_healthy
    environment:
      VITE_API_URL: http://localhost:3000
      pnpm_config_verify_deps_before_run: 'false'
    ports:
      - '127.0.0.1:5173:5173'
    volumes:
      - .:/app
      - /app/node_modules
      - /app/apps/web/node_modules
      - /app/packages/contract/node_modules
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'node -e "fetch(''http://127.0.0.1:5173'').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"',
        ]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    working_dir: /app
    init: true
    depends_on:
      db:
        condition: service_healthy
      contract:
        condition: service_healthy
    environment:
      NODE_ENV: development
      PORT: '3000'
      MONGODB_URI: 'mongodb://mongo:27017/assessment?replicaSet=rs0'
      MONGODB_TEST_URI: 'mongodb://mongo:27017/assessment_test?replicaSet=rs0'
      WEB_ORIGIN: ${WEB_ORIGIN:-http://localhost:5173}
      APP_URL: ${APP_URL:-http://localhost:5173}
      MAIL_FROM: '${MAIL_FROM:-Auth Assessment <no-reply@localhost>}'
      SESSION_ABSOLUTE_TTL: ${SESSION_ABSOLUTE_TTL:-7d}
      SESSION_IDLE_TTL: ${SESSION_IDLE_TTL:-1d}
      # Plain-HTTP dev: Safari drops Secure cookies on http://localhost.
      # Production keeps the default (true).
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-false}
      SMTP_URL: ${SMTP_URL:-}
      # The root build/typecheck run in this container and build the web app too.
      VITE_API_URL: http://localhost:3000
      pnpm_config_verify_deps_before_run: 'false'
    ports:
      - '127.0.0.1:3000:3000'
    volumes:
      - .:/app
      - /app/node_modules
      - /app/apps/api/node_modules
      - /app/apps/web/node_modules
      - /app/packages/db/node_modules
      - /app/packages/contract/node_modules

volumes:
  mongo_data:
