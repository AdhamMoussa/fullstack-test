services:
  mongo:
    image: mongo:8.0
    hostname: mongo
    restart: unless-stopped
    command: ["--replSet", "rs0", "--bind_ip_all"]
    ports:
      - "127.0.0.1:27017:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          mongosh --quiet --eval "
          try { rs.status().ok } catch (e) {
          rs.initiate({ _id: 'rs0', members: [{ _id: 0, host: 'mongo:27017' }] })
          }
          db.hello().isWritablePrimary
          " | grep true
      interval: 5s
      timeout: 10s
      retries: 20
      start_period: 10s

  db:
    build:
      context: .
      dockerfile: packages/db/Dockerfile
    working_dir: /app
    init: true
    depends_on:
      mongo:
        condition: service_healthy
    environment:
      MONGODB_URI: "mongodb://mongo:27017/assessment?replicaSet=rs0"
      MONGODB_TEST_URI: "mongodb://mongo:27017/assessment_test?replicaSet=rs0"
      pnpm_config_verify_deps_before_run: "false"
    ports:
      - "127.0.0.1:5555:5555" # Prisma Studio (`pnpm db:studio`)
    volumes:
      - .:/app
      # Anonymous volumes keep Linux node_modules out of the host tree.
      # `pnpm dev` recreates them from the fresh image (--renew-anon-volumes).
      - /app/node_modules
      - /app/apps/api/node_modules
      - /app/packages/db/node_modules
    healthcheck:
      test: ["CMD-SHELL", "test -f /tmp/db-ready"]
      interval: 3s
      timeout: 5s
      retries: 40
      start_period: 30s

  contract:
    build:
      context: .
      dockerfile: packages/contract/Dockerfile
    working_dir: /app
    init: true
    environment:
      pnpm_config_verify_deps_before_run: "false"
    volumes:
      - .:/app
      - /app/node_modules
      - /app/packages/contract/node_modules
    healthcheck:
      test: ["CMD-SHELL", "test -f packages/contract/dist/index.js"]
      interval: 3s
      timeout: 5s
      retries: 40
      start_period: 20s

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    working_dir: /app
    init: true
    depends_on:
      db:
        condition: service_healthy
      contract:
        condition: service_healthy
    environment:
      NODE_ENV: development
      PORT: "3000"
      MONGODB_URI: "mongodb://mongo:27017/assessment?replicaSet=rs0"
      MONGODB_TEST_URI: "mongodb://mongo:27017/assessment_test?replicaSet=rs0"
      JWT_SECRET: ${JWT_SECRET:-dev-only-change-me}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-1h}
      WEB_ORIGIN: ${WEB_ORIGIN:-http://localhost:5173}
      pnpm_config_verify_deps_before_run: "false"
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - .:/app
      - /app/node_modules
      - /app/apps/api/node_modules
      - /app/packages/db/node_modules
      - /app/packages/contract/node_modules

volumes:
  mongo_data:
